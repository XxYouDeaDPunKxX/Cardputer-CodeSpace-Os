[unix_http_server]
file=/workspaces/.csos-smoke/supervisor.sock
chmod=0600

[supervisord]
logfile=/workspaces/.csos-smoke/autonomy-logs/supervisord.log
pidfile=/workspaces/.csos-smoke/supervisord.pid
childlogdir=/workspaces/.csos-smoke/autonomy-logs
environment=DISPLAY=":77",XAUTHORITY="/workspaces/.csos-smoke/Xauthority"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///workspaces/.csos-smoke/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :77 -screen 0 640x480x24 +extension XTEST -nolisten tcp -auth /workspaces/.csos-smoke/Xauthority
priority=10
autorestart=true
startretries=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspaces/.csos-smoke/autonomy-logs/xvfb.log

[program:xfce]
command=/usr/bin/dbus-run-session -- /bin/bash "%(ENV_CSOS_REPO)s/server/desktop-session.sh"
priority=20
autorestart=true
startretries=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspaces/.csos-smoke/autonomy-logs/xfce.log

[program:cxl]
command=/workspaces/.csos-smoke/autonomy-venv/bin/python /workspaces/.csos-smoke/wss_service.py cxl
priority=30
autorestart=true
startretries=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspaces/.csos-smoke/autonomy-logs/cxl.log

[program:bridge]
command=/workspaces/.csos-smoke/autonomy-venv/bin/python "%(ENV_CSOS_REPO)s/.devcontainer/bridge.py"
priority=40
autostart=false
autorestart=true
startretries=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspaces/.csos-smoke/autonomy-logs/bridge.log

[program:port-keeper]
command=/workspaces/.csos-smoke/autonomy-venv/bin/python "%(ENV_CSOS_REPO)s/.devcontainer/port_keeper.py"
priority=50
autorestart=true
startretries=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspaces/.csos-smoke/autonomy-logs/port-keeper.log

[program:csos-presence]
command=/usr/bin/env node /workspaces/.csos-smoke/presence_rpc.cjs --lease /workspaces/.csos-smoke/presence-lease.json --control /workspaces/.csos-smoke/exposure-control.json
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stopwaitsecs=5
redirect_stderr=true
stdout_logfile=/workspaces/.csos-smoke/presence-worker.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
